<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EvoDevs — Motion Ident 10s</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070c0f; --teal:#14b8a6; --teal-l:#2dd4bf; --cyan:#22d3ee; --white:#e8eded;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-pop:cubic-bezier(.34,1.56,.64,1);
    --ease-spin:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#04080a;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1.5rem}

  /* ============ STAGE 16:9 ============ */
  .stage-wrap{width:min(1100px,96vw)}
  .stage{position:relative;aspect-ratio:16/9;background:var(--bg);border-radius:1.2rem;overflow:hidden;border:1px solid rgba(45,212,191,.15);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .stage:fullscreen{border-radius:0;border:none;width:100vw;height:100vh;aspect-ratio:auto}

  /* Décor */
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(45,212,191,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(45,212,191,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);opacity:0;transition:opacity 1s}
  .play .grid-bg{opacity:1}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.25}
  .blob-a{width:340px;height:340px;background:var(--teal);top:-90px;left:-70px;animation:blobFloat 9s ease-in-out infinite alternate}
  .blob-b{width:300px;height:300px;background:var(--cyan);bottom:-90px;right:-60px;animation:blobFloat 11s ease-in-out infinite alternate-reverse}
  @keyframes blobFloat{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}
  .particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--teal-l);opacity:.4;animation:floatP 6s ease-in-out infinite alternate}
  .particle:nth-child(1){left:12%;top:22%;animation-delay:.2s}
  .particle:nth-child(2){left:26%;top:70%;width:3px;height:3px;animation-delay:1.1s}
  .particle:nth-child(3){left:44%;top:15%;animation-delay:.6s}
  .particle:nth-child(4){left:63%;top:78%;width:5px;height:5px;background:var(--cyan);animation-delay:1.6s}
  .particle:nth-child(5){left:78%;top:30%;animation-delay:.9s}
  .particle:nth-child(6){left:88%;top:60%;width:3px;height:3px;animation-delay:.3s}
  .particle:nth-child(7){left:8%;top:55%;width:3px;height:3px;background:var(--cyan);animation-delay:2s}
  .particle:nth-child(8){left:55%;top:88%;animation-delay:1.3s}
  @keyframes floatP{from{transform:translateY(0)}to{transform:translateY(-26px)}}

  /* ============ LOCKUP ============ */
  .lockup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3.2rem}
  .monogram{--shift-x:min(280px,32vw);position:relative;width:clamp(150px,24vw,240px)}
  .mono-glow{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(45,212,191,.35),transparent 65%);opacity:0;filter:blur(10px)}
  .play .mono-glow{animation:glowIn 1.2s var(--ease-out) 2.5s both}
  @keyframes glowIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

  .play .monogram{animation:monogramMove 1.2s var(--ease-out) 4.2s both}
  @keyframes monogramMove{from{transform:translateX(var(--shift-x)) scale(1.12)}to{transform:translateX(0) scale(1)}}

  /* SVG monogram */
  svg{width:100%;height:auto;display:block;overflow:visible}
  .arc{opacity:0;transform-box:fill-box;transform-origin:center;stroke:var(--teal-l);stroke-width:8;fill:none;stroke-linecap:round}
  .play .arc1{animation:arcIn1 1.1s var(--ease-out) .30s both}
  .play .arc2{animation:arcIn2 1.1s var(--ease-out) .45s both}
  .play .arc3{animation:arcIn3 1.1s var(--ease-out) .60s both}
  .play .arc4{animation:arcIn4 1.1s var(--ease-out) .75s both}
  @keyframes arcIn1{from{opacity:0;transform:translate(-160px,-120px) rotate(-160deg)}to{opacity:1;transform:none}}
  @keyframes arcIn2{from{opacity:0;transform:translate(170px,-110px) rotate(140deg)}to{opacity:1;transform:none}}
  @keyframes arcIn3{from{opacity:0;transform:translate(150px,130px) rotate(-140deg)}to{opacity:1;transform:none}}
  @keyframes arcIn4{from{opacity:0;transform:translate(-170px,120px) rotate(160deg)}to{opacity:1;transform:none}}

  #ringGroup{transform-box:view-box;transform-origin:50% 50%}
  .play #ringGroup{animation:spinIn 2s var(--ease-spin) 1.2s both}
  @keyframes spinIn{from{transform:rotate(-540deg)}to{transform:rotate(0deg)}}

  .node{opacity:0;transform-box:fill-box;transform-origin:center;fill:var(--teal-l)}
  .play .node1{animation:nodePop .5s var(--ease-pop) 1.40s both}
  .play .node2{animation:nodePop .5s var(--ease-pop) 1.52s both}
  .play .node3{animation:nodePop .5s var(--ease-pop) 1.64s both}
  .play .node4{animation:nodePop .5s var(--ease-pop) 1.76s both}
  @keyframes nodePop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

  #innerCircle{stroke:var(--teal-l);stroke-width:2;fill:none;opacity:.45;stroke-dasharray:352;stroke-dashoffset:352}
  .play #innerCircle{animation:draw 1s var(--ease-out) 1.3s both}
  @keyframes draw{to{stroke-dashoffset:0}}

  #flash{stroke:var(--cyan);stroke-width:10;fill:none;opacity:0;filter:blur(6px)}
  .play #flash{animation:flash .8s ease-out 2.55s both}
  @keyframes flash{0%{opacity:0}30%{opacity:.85}100%{opacity:0}}

  #edText{font-family:Inter,sans-serif;font-weight:900;font-size:64px;fill:var(--white);opacity:0;transform-box:fill-box;transform-origin:center}
  .play #edText{animation:stamp .7s var(--ease-pop) 2.6s both}
  @keyframes stamp{from{opacity:0;transform:scale(2.6);filter:blur(12px)}to{opacity:1;transform:scale(1);filter:blur(0)}}

  /* ============ WORDMARK ============ */
  .wordblock{position:relative;overflow:hidden;padding:.4rem .2rem}
  .wordmark{font-size:clamp(2rem,6vw,4.6rem);font-weight:900;letter-spacing:-.02em;color:var(--white);white-space:nowrap}
  .letter{display:inline-block;opacity:0}
  .letter.accent{color:var(--teal-l)}
  .play .letter:nth-child(1){animation:letterIn .55s var(--ease-out) 5.00s both, accentFlash .6s ease-out 5.20s both}
  .play .letter:nth-child(2){animation:letterIn .55s var(--ease-out) 5.08s both}
  .play .letter:nth-child(3){animation:letterIn .55s var(--ease-out) 5.16s both}
  .play .letter:nth-child(4){animation:letterIn .55s var(--ease-out) 5.24s both, accentFlash .6s ease-out 5.44s both}
  .play .letter:nth-child(5){animation:letterIn .55s var(--ease-out) 5.32s both}
  .play .letter:nth-child(6){animation:letterIn .55s var(--ease-out) 5.40s both}
  .play .letter:nth-child(7){animation:letterIn .55s var(--ease-out) 5.48s both}
  .play .letter:nth-child(8){animation:letterIn .55s var(--ease-out) 5.56s both, accentFlash .6s ease-out 5.76s both}
  .play .letter:nth-child(9){animation:letterIn .55s var(--ease-out) 5.64s both}
  .play .letter:nth-child(10){animation:letterIn .55s var(--ease-out) 5.72s both, accentFlash .6s ease-out 5.92s both}
  @keyframes letterIn{from{opacity:0;transform:translateY(36px) rotateX(70deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes accentFlash{0%{text-shadow:0 0 0 rgba(34,211,238,0)}40%{text-shadow:0 0 26px rgba(34,211,238,.95)}100%{text-shadow:0 0 10px rgba(34,211,238,.35)}}

  .shine{position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-160%);pointer-events:none}
  .play .shine{animation:shineSweep .9s var(--ease-out) 8.9s both}
  @keyframes shineSweep{to{transform:translateX(320%)}}

  .draw-line{height:2px;margin-top:.9rem;background:linear-gradient(90deg,var(--teal),var(--cyan));transform:scaleX(0);transform-origin:left;position:relative}
  .play .draw-line{animation:lineDraw .7s var(--ease-out) 6.6s both}
  @keyframes lineDraw{to{transform:scaleX(1)}}
  .line-dot{position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);opacity:0}
  .play .line-dot{animation:dotPing .5s var(--ease-pop) 7.25s both}
  @keyframes dotPing{from{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}

  .team-line{display:flex;align-items:center;gap:.7rem;margin-top:1.1rem;color:var(--white);font-weight:800;font-size:clamp(.8rem,1.4vw,1.05rem);opacity:0}
  .team-square{width:.7em;height:.7em;background:var(--teal-l);transform:scale(0)}
  .play .team-line{animation:teamIn .6s var(--ease-out) 7.5s both}
  .play .team-square{animation:nodePop .4s var(--ease-pop) 7.5s both}
  @keyframes teamIn{from{opacity:0;letter-spacing:.8em}to{opacity:1;letter-spacing:.35em}}

  .tagline{margin-top:.7rem;color:var(--teal-l);font-weight:600;font-size:clamp(.7rem,1.2vw,.95rem);opacity:0}
  .play .tagline{animation:tagIn .7s var(--ease-out) 8.1s both}
  @keyframes tagIn{from{opacity:0;transform:translateY(14px);letter-spacing:.5em}to{opacity:1;transform:none;letter-spacing:.3em}}

  .pulse{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(45,212,191,.28),transparent 60%);opacity:0;pointer-events:none}
  .play .pulse{animation:pulseGlow .9s ease-out 8.9s both}
  @keyframes pulseGlow{0%{opacity:0;transform:scale(.8)}35%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

  /* ============ HUD ============ */
  .hud{position:absolute;font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.14em;color:rgba(232,237,237,.55);text-transform:uppercase}
  .hud-tl{top:1.1rem;left:1.3rem}
  .hud-tr{top:1.1rem;right:1.3rem;color:var(--teal-l)}
  .progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.07)}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));transform:scaleX(0);transform-origin:left}
  .play .progress span{animation:prog 10s linear both}
  @keyframes prog{to{transform:scaleX(1)}}
  [data-hud="off"] .hud,[data-hud="off"] .progress{display:none}

  /* ============ TOOLBAR ============ */
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;justify-content:center}
  .btn{cursor:pointer;border:none;border-radius:.8rem;padding:.75rem 1.4rem;font-weight:700;font-size:.9rem;font-family:Inter,sans-serif;transition:transform .2s,background .2s}
  .btn-primary{background:var(--teal);color:#04211c}
  .btn-primary:hover{background:var(--teal-l);transform:translateY(-2px)}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--white);border:1px solid rgba(255,255,255,.12)}
  .btn-ghost:hover{background:rgba(255,255,255,.12)}
  .toolbar label{display:flex;align-items:center;gap:.5rem;color:rgba(232,237,237,.7);font-size:.85rem;cursor:pointer}
  .hint{color:rgba(232,237,237,.5);font-size:.82rem;text-align:center;max-width:60ch;line-height:1.6}

  /* ============ RESPONSIVE / REDUCED ============ */
  @media (max-width:820px){
    .lockup{flex-direction:column;gap:1.6rem}
    .monogram{--shift-x:0px;width:clamp(130px,40vw,190px)}
    .wordblock{text-align:center}
    .team-line{justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    .play *{animation:none !important}
    .arc,.node,#edText,.letter,.team-line,.tagline,.line-dot{opacity:1;transform:none;filter:none}
    #innerCircle{stroke-dashoffset:0}
    .draw-line{transform:scaleX(1)}
    .team-square{transform:scale(1)}
    .grid-bg{opacity:1}
    .mono-glow{opacity:1}
  }
</style>
</head>
<body>

  <div class="stage-wrap">
    <div class="stage" id="stage" data-hud="on">
      <div class="grid-bg"></div>
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span>
      <span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span>

      <div class="lockup">
        <!-- Monogramme ED -->
        <div class="monogram">
          <div class="mono-glow"></div>
          <svg viewBox="0 0 200 200" aria-label="Logo EvoDevs">
            <circle id="flash" cx="100" cy="100" r="70"/>
            <g id="ringGroup">
              <path class="arc arc1" d="M 112.15 31.06 A 70 70 0 0 1 168.94 87.85"/>
              <path class="arc arc2" d="M 168.94 112.15 A 70 70 0 0 1 112.15 168.94"/>
              <path class="arc arc3" d="M 87.85 168.94 A 70 70 0 0 1 31.06 112.15"/>
              <path class="arc arc4" d="M 31.06 87.85 A 70 70 0 0 1 87.85 31.06"/>
              <circle class="node node1" cx="100" cy="30" r="7"/>
              <circle class="node node2" cx="170" cy="100" r="7"/>
              <circle class="node node3" cx="100" cy="170" r="7"/>
              <circle class="node node4" cx="30" cy="100" r="7"/>
            </g>
            <circle id="innerCircle" cx="100" cy="100" r="56"/>
            <text id="edText" x="100" y="122" text-anchor="middle">ED</text>
          </svg>
        </div>

        <!-- Wordmark -->
        <div class="wordblock">
          <div class="wordmark" aria-label="EvoDevs">
            <span class="letter accent">&lt;</span><span class="letter">E</span><span class="letter">v</span><span class="letter accent">o</span><span class="letter">D</span><span class="letter">e</span><span class="letter">v</span><span class="letter accent">s</span><span class="letter">/</span><span class="letter accent">&gt;</span>
          </div>
          <div class="draw-line"><span class="line-dot"></span></div>
          <div class="team-line"><span class="team-square"></span>TEAM</div>
          <div class="tagline">&lt; DIGITAL EVOLUTION &gt;</div>
          <div class="shine"></div>
        </div>
      </div>

      <div class="pulse"></div>
      <div class="vignette"></div>

      <div class="hud hud-tl">EvoDevs — Motion Ident v1</div>
      <div class="hud hud-tr" id="timecode">00:00.0</div>
      <div class="progress"><span></span></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" id="replay">↺ Rejouer</button>
    <button class="btn btn-ghost" id="fullscreen">⛶ Plein écran</button>
    <label><input type="checkbox" id="hud-toggle" checked /> Afficher le HUD</label>
  </div>
  <p class="hint">💡 Pour exporter en MP4 : cliquez <strong>Plein écran</strong>, lancez une capture (OBS, QuickTime, Xbox Game Bar…), puis <strong>Rejouer</strong>. La séquence dure exactement 10 s. Décochez le HUD pour un rendu propre.</p>

<script>
  const stage = document.getElementById('stage');
  const timecode = document.getElementById('timecode');
  let raf = null;

  function startTimecode(){
    cancelAnimationFrame(raf);
    const t0 = performance.now();
    const tick = (now) => {
      const el = Math.min((now - t0) / 1000, 10);
      const s = Math.floor(el), d = Math.floor((el - s) * 10);
      timecode.textContent = `00:${String(s).padStart(2,'0')}.${d}`;
      if (el < 10) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  function play(){
    stage.classList.remove('play');
    void stage.offsetWidth; /* force le reflow pour relancer les keyframes */
    stage.classList.add('play');
    startTimecode();
  }

  document.getElementById('replay').addEventListener('click', play);
  document.getElementById('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen();
  });
  document.getElementById('hud-toggle').addEventListener('change', (e) => {
    stage.dataset.hud = e.target.checked ? 'on' : 'off';
  });

  window.addEventListener('load', play);
</script>
</body>
</html>
